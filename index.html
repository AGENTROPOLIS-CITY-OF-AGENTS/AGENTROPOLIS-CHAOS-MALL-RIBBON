<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaos Mall — Product Ribbon</title>
<link rel="stylesheet" href="ribbon-kit.css">
<style>
/* Chaos Mall page chrome — HERMES CITY navigator/guide pattern, adapted to the shop.
   Page-owned styles only. The vendored ribbon kit (ribbon-kit.css) is untouched. */
.guide-backdrop {
  position: fixed; inset: 0; z-index: 9;
  background: rgba(0, 0, 0, .62);
}
.guide {
  position: fixed; z-index: 10; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(560px, calc(100vw - 32px));
  max-height: calc(100vh - 48px);
  max-height: calc(100dvh - 48px);
  overflow-y: auto;
  background: var(--obsidian); color: #fff;
  border: 1px solid var(--hair);
  border-top: 2px solid var(--red);
  padding: 36px 32px 24px;
  text-align: left;
}
.guide[hidden], .guide-backdrop[hidden], .preview-badge[hidden] { display: none; }
.guide-eyebrow {
  color: var(--cyan);
  font-size: 11px; font-weight: 600;
  letter-spacing: .18em; text-transform: uppercase;
  margin-bottom: 14px;
}
.guide h1 {
  font-size: 28px; line-height: 1.25; font-weight: 600;
  letter-spacing: -.01em; margin-bottom: 12px;
}
.guide-sub { color: var(--muted); font-size: 15px; line-height: 1.55; margin-bottom: 4px; }
.guide-sub-note { color: var(--muted); font-size: 13px; line-height: 1.5; margin-bottom: 24px; opacity: .75; }
.guide-actions { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
.guide-actions button {
  min-height: 52px; width: 100%;
  font: 600 13px/1.4 "Inter Tight", system-ui, sans-serif;
  letter-spacing: .08em; text-transform: uppercase;
  cursor: pointer; border-radius: 0;
  padding: 14px 18px; text-align: center;
}
.guide-action-primary { background: var(--cyan); color: var(--obsidian); border: 1px solid var(--cyan); }
.guide-action-secondary { background: transparent; color: #fff; border: 1px solid rgba(255, 255, 255, .45); }
.guide-action-secondary:hover { border-color: var(--cyan); color: var(--cyan); }
.guide-action-tertiary { background: transparent; color: var(--muted); border: 1px solid transparent; text-decoration: underline; text-underline-offset: 4px; }
.guide-action-tertiary:hover { color: #fff; }
.guide-frame {
  border-top: 1px solid var(--hair);
  padding-top: 18px;
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  text-align: center; color: var(--muted); line-height: 1.7;
}
.guide-frame b { color: var(--red); font-weight: 700; }
.guide-dismiss {
  display: block; margin: 18px auto 0;
  background: none; border: 0; cursor: pointer;
  color: var(--muted); font: 500 12px/1.4 "Inter Tight", system-ui, sans-serif;
  letter-spacing: .1em; text-transform: uppercase; padding: 10px 12px;
}
.guide-dismiss:hover { color: var(--cyan); }
.guide-x {
  position: absolute; top: 8px; right: 8px;
  width: 44px; height: 44px;
  background: none; border: 0; cursor: pointer;
  color: #fff; font-size: 22px; line-height: 1; padding: 0;
}
.guide-x:hover { color: var(--cyan); }
.preview-badge {
  position: fixed; z-index: 6; left: 50%; top: calc(40 * var(--u));
  transform: translateX(-50%);
  background: var(--obsidian); color: #fff;
  border: 1px solid var(--hair);
  font: 600 10px/1.4 "Inter Tight", system-ui, sans-serif;
  letter-spacing: .14em; text-transform: uppercase;
  padding: 9px 14px; cursor: pointer; white-space: nowrap;
}
.preview-badge b { color: var(--red); font-weight: 700; }
.preview-badge span { color: var(--cyan); font-weight: 700; }
.preview-badge:hover { border-color: var(--cyan); }
@media (max-width: 649px) {
  .guide { padding: 28px 20px 20px; }
  .guide h1 { font-size: 22px; }
  .guide-sub { font-size: 14px; }
  .guide-actions button { min-height: 48px; }
  .preview-badge { top: calc(64 * var(--u)); font-size: 9px; padding: 8px 12px; }
}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<nav class="ui" aria-label="Site">
  <a class="tl" href="https://agentropolis-city-of-agents.github.io/AGENTROPOLIS-CHAOS-MALL-RIBBON/">Chaos Mall<b> — 54</b></a>
  <button class="tr" type="button">Enter the mall</button>
  <a class="bl" href="#list">Featured <span>/</span> <span>All</span></a>
  <button class="br" type="button">Shop the mall</button>
</nav>
<div class="guide-backdrop" id="guide-backdrop" aria-hidden="true"></div>
<section class="guide" id="guide" aria-labelledby="guide-title">
  <button class="guide-x" type="button" aria-label="Close guide" data-guide-close>&times;</button>
  <p class="guide-eyebrow">Navigator &middot; Guide</p>
  <h1 id="guide-title">First &middot; tell me what you came for</h1>
  <p class="guide-sub">Pick what you came to do.</p>
  <p class="guide-sub-note">No account. No keys. Just pick one.</p>
  <div class="guide-actions">
    <button class="guide-action-primary" type="button" data-guide-go>Enter the mall</button>
    <button class="guide-action-secondary" type="button" data-guide-go>Shop the mall</button>
    <button class="guide-action-tertiary" type="button" data-guide-go>View featured / all</button>
  </div>
  <p class="guide-frame"><b>Preview</b> &middot; Not live &middot; Guidance is not permission</p>
  <button class="guide-dismiss" type="button" data-guide-close>Browse the ribbon</button>
</section>
<button class="preview-badge" id="preview-badge" type="button" hidden><b>Preview</b> &middot; Not live &middot; <span>Guide</span></button>
<div class="loader" aria-hidden="true"><i></i><i></i><i></i></div>
<main class="sr" id="list" aria-label="Featured work"></main>
<script type="importmap">
{ "imports": { "three": "./three.module.js", "ribbon-kit": "./ribbon-kit.js" } }
</script>
<script type="module">
import { createRibbonApp } from 'ribbon-kit';

/* Chaos Mall product ribbon — THIN SHELL on the ribbon kit.
   Everything engine lives in ribbon-kit.js (vendored copy, source of
   truth: workspace/builds/ribbon-kit/). This file holds only the mall's
   own content: its cards, its strings, its links. */
const CARDS = [
  { title: 'Atrium',            video: 'media/atrium.mp4',            poster: 'media/atrium.jpg',            aspect: 1280 / 720 },
  { title: 'Signal Scout',      video: 'media/signal-scout.mp4',      poster: 'media/signal-scout.jpg',      aspect: 1280 / 720 },
  { title: 'Hook Forge',        video: 'media/hook-forge.mp4',        poster: 'media/hook-forge.jpg',        aspect: 1280 / 720 },
  { title: 'Quant Lens',        video: 'media/quant-lens.mp4',        poster: 'media/quant-lens.jpg',        aspect: 1280 / 720 },
  { title: 'Deck Pilot',        video: 'media/deck-pilot.mp4',        poster: 'media/deck-pilot.jpg',        aspect: 1280 / 720 },
  { title: 'Ops Relay',         video: 'media/ops-relay.mp4',         poster: 'media/ops-relay.jpg',         aspect: 1280 / 720 },
  { title: 'Lead Loom',         video: 'media/lead-loom.mp4',         poster: 'media/lead-loom.jpg',         aspect: 1280 / 720 },
  { title: 'Fleet Command 54',  video: 'media/fleet-command-54.mp4',  poster: 'media/fleet-command-54.jpg',  aspect: 1280 / 720 },
];

const list = document.getElementById('list');
for (const c of CARDS) {
  const a = document.createElement('article');
  const h = document.createElement('h2');
  h.textContent = c.title;
  a.appendChild(h); list.appendChild(a);
}
const goToRibbon = () => document.getElementById('list').scrollIntoView({ behavior: 'smooth' });
document.querySelector('.tr').addEventListener('click', goToRibbon);
document.querySelector('.br').addEventListener('click', goToRibbon);

/* HERMES CITY guide pattern, adapted to the shop. Page chrome only;
   the kit is untouched. The guide opens first; any first action closes
   it and moves to the ribbon. The preview badge stays visible after
   the guide closes and reopens it. */
const guide = document.getElementById('guide');
const backdrop = document.getElementById('guide-backdrop');
const badge = document.getElementById('preview-badge');
const openGuide = () => { guide.hidden = false; backdrop.hidden = false; badge.hidden = true; };
const closeGuide = () => { guide.hidden = true; backdrop.hidden = true; badge.hidden = false; };
badge.addEventListener('click', openGuide);
document.querySelectorAll('[data-guide-close]').forEach((el) => el.addEventListener('click', closeGuide));
document.querySelectorAll('[data-guide-go]').forEach((el) => el.addEventListener('click', () => { closeGuide(); goToRibbon(); }));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !guide.hidden) closeGuide(); });

const app = createRibbonApp({
  canvas: document.getElementById('gl'),
  cards: CARDS,
});
window.__ribbon = app.cards;
</script>
</body>
</html>
